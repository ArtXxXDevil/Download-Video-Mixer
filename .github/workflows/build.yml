name: Build Download Video Mixer

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Build Windows app
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon icon.ico --add-data "icon.ico;." --name "Download Video Mixer" app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Download-Video-Mixer-Windows-x64
          path: "dist/Download Video Mixer.exe"
          if-no-files-found: error

  build-macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --windowed --icon icon.icns --add-data "icon.icns:." --name "Download Video Mixer" app.py

      - name: Create ZIP archive (macOS)
        run: |
          cd dist
          zip -r "Download Video Mixer-macOS.zip" "Download Video Mixer.app"

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Download-Video-Mixer-macOS
          path: "dist/Download Video Mixer-macOS.zip"
          if-no-files-found: error
